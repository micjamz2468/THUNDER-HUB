<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Thunder Hub - View our products and contact us on WhatsApp.">
<title>Thunder Hub</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;color:#222}
header{background:#111;color:#d4af37;text-align:center;padding:22px 15px}
header h1{margin:0;font-size:30px}
header p{margin:6px 0 0;color:#fff;font-size:16px}
.hero{background:#222;color:#fff;text-align:center;padding:40px 18px}
.hero h2{margin:0 0 12px;color:#d4af37;font-size:28px}
.hero p{margin:0;line-height:1.5;font-size:17px}
.container{width:94%;max-width:1100px;margin:28px auto 50px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.12)}
.card img{width:100%;height:220px;object-fit:cover;display:block;background:#eee}
.body{padding:16px}
.body h3{margin:0 0 8px;font-size:20px}
.body p{margin:0 0 15px;color:#666;line-height:1.5}
.buttons{display:flex;gap:8px}
.btn,button{flex:1;padding:12px 8px;border:0;border-radius:9px;font-weight:bold;text-align:center;text-decoration:none;cursor:pointer;font-size:14px}
.whatsapp{background:#25D366;color:#fff}
.share{background:#111;color:#d4af37}
.empty{text-align:center;background:#fff;border-radius:12px;padding:35px 20px;color:#666}
footer{background:#111;color:#fff;text-align:center;padding:25px 15px}
footer strong{color:#d4af37}
footer a{color:#25D366;text-decoration:none}
</style>
</head>
<body>

<header>
<h1>THUNDER HUB</h1>
<p>Shop Smart. Shop Thunder.</p>
</header>

<section class="hero">
<h2>Our Products</h2>
<p>View our products and chat with us on WhatsApp for price and more information.</p>
</section>

<div class="container">
<div class="products" id="productGrid"></div>
</div>

<footer>
<p><strong>Thunder Hub</strong></p>
<p>For enquiries: <a href="https://wa.me/2348032744506" target="_blank">08032744506 WhatsApp</a></p>
</footer>

<script>
const WHATSAPP="2348032744506";

/*
  CUSTOMER PAGE
  Products are controlled here by the admin.
  Customers only see products, WhatsApp and Share.
*/
const products=[
{name:"Product 1",image:"images/product1.jpg",description:"Quality product. Chat with us on WhatsApp for price and information."},
{name:"Product 2",image:"images/product2.jpg",description:"Quality product. Chat with us on WhatsApp for price and information."},
{name:"Product 3",image:"images/product3.jpg",description:"Quality product. Chat with us on WhatsApp for price and information."}
];

function wa(name){
return "https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent("Hello Thunder Hub, I want information about "+name+".");
}

function shareProduct(p){
const url=location.href.split("?")[0]+"?product="+encodeURIComponent(p.name);
if(navigator.share){
navigator.share({title:p.name+" | Thunder Hub",text:"Check out "+p.name+" on Thunder Hub.",url:url}).catch(()=>{});
}else if(navigator.clipboard){
navigator.clipboard.writeText(url).then(()=>alert("Product link copied."));
}else{
alert("Share this page: "+url);
}
}

const grid=document.getElementById("productGrid");

products.forEach((p,i)=>{
const card=document.createElement("div");
card.className="card";
card.innerHTML=`
<img src="${p.image}" alt="${p.name}">
<div class="body">
<h3>${p.name}</h3>
<p>${p.description}</p>
<div class="buttons">
<a class="btn whatsapp" href="${wa(p.name)}" target="_blank">💬 WhatsApp</a>
<button class="share" onclick="shareProduct(products[${i}])">🔗 Share</button>
</div>
</div>`;
grid.appendChild(card);
});
</script>

</body>
</html>
